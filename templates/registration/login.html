{% extends 'base.html' %}
{% block title %}Войти — ByteLink{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="auth-card fade-up">
        <div class="glass p-5">
            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="brand-icon-lg">
                    <i class="bi bi-hexagon-fill"></i>
                </div>
                <h3 style="font-family: var(--font-alt); font-size: 1.4rem;">Войти в ByteLink</h3>
                <p style="font-size: .85rem; color: var(--text-2); margin-top: .3rem;">
                    Введите ваши учётные данные
                </p>
            </div>

            {% if form.errors %}
            <div class="alert mb-3" role="alert">
                <i class="bi bi-exclamation-triangle me-2" style="color: var(--red);"></i>
                Неверное имя пользователя или пароль.
            </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Имя пользователя</label>
                    <input type="text" name="username" id="id_username" class="form-control"
                           placeholder="username" autofocus required>
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label">Пароль</label>
                    <input type="password" name="password" id="id_password" class="form-control"
                           placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary-app w-100 justify-content-center"
                        style="font-size: .95rem; padding: .7rem 1rem;">
                    Войти
                </button>
            </form>

            <p class="text-center mt-4 mb-0" style="font-size: .85rem; color: var(--text-2);">
                Нет аккаунта?
                <a href="{% url 'register' %}" style="color: var(--accent-2); font-weight: 600;">
                    Зарегистрироваться
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
